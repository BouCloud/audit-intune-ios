# HAProxy - TLS conforme aux exigences Apple iOS 27 (ATS / FCP v2.1)
# Pré-requis : HAProxy 2.x lié à OpenSSL 1.1.1+ (vérifier : haproxy -vv | grep -i openssl)
#
# Extrait de la section global, puis exemple de frontal devant un serveur web existant.
# Utile quand le serveur web ne peut pas évoluer (ex. Apache 2.4.6 / OpenSSL 1.0.2 sur CentOS 7) :
# HAProxy termine le TLS moderne et relaie vers le backend.

global
    ssl-default-bind-options       ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers       ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-ciphersuites  TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256

frontend fe_https
    mode http
    # PEM = certificat + chaîne + clé privée
    bind :443 ssl crt /etc/haproxy/certs/site.pem alpn http/1.1
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend be_web

backend be_web
    mode http
    # SNI transmis pour que le serveur web sélectionne le bon vhost
    server web1 192.0.2.10:443 ssl sni req.hdr(host),field(1,:) verify none check
