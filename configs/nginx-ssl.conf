# nginx - TLS conforme aux exigences Apple iOS 27 (ATS / FCP v2.1)
# Pré-requis : nginx 1.13+ lié à OpenSSL 1.1.1+ (vérifier : nginx -V 2>&1 | grep -i openssl)
#
# À inclure dans le bloc http {} (tous les sites) ou dans un server {}.

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers on;
ssl_session_tickets       off;

# ssl_ciphers ne concerne que TLS 1.2 : les suites TLS 1.3 par défaut d'OpenSSL sont toutes conformes.
