# Apache httpd - TLS conforme aux exigences Apple iOS 27 (ATS / FCP v2.1)
# Pré-requis : Apache 2.4.37+ lié à OpenSSL 1.1.1+ (TLS 1.3 et Extended Master Secret)
# Vérifier : ldd $(find / -name mod_ssl.so 2>/dev/null | head -1) | grep libssl   (libssl.so.1.1 ou .so.3 = OK)
#
# À placer hors de tout <VirtualHost> (ex. conf.d/00-tls.conf) pour couvrir tous les sites,
# et à reporter dans le <VirtualHost _default_:443> de ssl.conf s'il redéfinit ces directives.

SSLProtocol          -all +TLSv1.2 +TLSv1.3
SSLCipherSuite       ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
SSLHonorCipherOrder  on
SSLCompression       off
SSLSessionTickets    off

# Apache 2.4.36 ou moins : retirer "+TLSv1.3" (directive refusée), l'EMS restera absent si OpenSSL < 1.1.0
