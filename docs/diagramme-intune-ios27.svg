<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="t d">
  <title id="t">Enrôlement BYOD Intune sous iOS 27 : contrôle TLS et remédiation</title>
  <desc id="d">L'iPhone récupère le fichier de découverte sur le serveur web du domaine, qui doit passer le contrôle TLS d'iOS 27, s'authentifie auprès de Microsoft Entra ID puis s'enrôle dans Microsoft Intune. En dessous, le parcours de remédiation selon le résultat de l'audit.</desc>
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .ink  { fill: #1f2328; }
      .mut  { fill: #57606a; }
      .acc  { fill: #0b5cad; }
      .dan  { fill: #b42318; }
      .box  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .ms   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .act  { fill: #ffffff; stroke: #1f2328; stroke-width: 1.4; }
      .chk  { fill: #eef5fc; stroke: #0b5cad; stroke-width: 1.2; }
      .err  { fill: #fdf2f1; stroke: #b42318; stroke-width: 1.2; }
      .ln   { stroke: #57606a; stroke-width: 1.4; fill: none; }
      .lnA  { stroke: #0b5cad; stroke-width: 1.6; fill: none; }
      .lif  { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 4; }
      .sep  { stroke: #d0d7de; stroke-width: 1; }
      text  { font-family: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; }
      .h2   { font-size: 13.5px; font-weight: 600; letter-spacing: .05em; }
      .lb   { font-size: 14px; font-weight: 600; }
      .sm   { font-size: 12px; }
      .xs   { font-size: 11px; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #0d1117; }
        .ink { fill: #e6edf3; }
        .mut { fill: #9198a1; }
        .acc { fill: #58a6ff; }
        .dan { fill: #ff7b72; }
        .box { fill: #161b22; stroke: #30363d; }
        .ms  { fill: #161b22; stroke: #6e7681; }
        .act { fill: #0d1117; stroke: #e6edf3; }
        .chk { fill: #0f2236; stroke: #58a6ff; }
        .err { fill: #2b1314; stroke: #ff7b72; }
        .ln  { stroke: #9198a1; }
        .lnA { stroke: #58a6ff; }
        .lif { stroke: #484f58; }
        .sep { stroke: #30363d; }
      }
    </style>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mut"/>
    </marker>
    <marker id="flA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="acc"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="790"/>

  <!-- ===================== 1. Séquence d'enrôlement ===================== -->
  <text class="h2 mut" x="30" y="34">1 · ENRÔLEMENT BYOD INTUNE (ACCOUNT-DRIVEN)</text>

  <rect class="act" x="30"  y="52" width="160" height="54" rx="6"/>
  <text class="lb ink" x="110" y="76" text-anchor="middle">iPhone</text>
  <text class="sm mut" x="110" y="94" text-anchor="middle">iOS · iPadOS 27</text>

  <rect class="act" x="350" y="52" width="160" height="54" rx="6"/>
  <text class="lb ink" x="430" y="76" text-anchor="middle">Serveur web</text>
  <text class="sm mut" x="430" y="94" text-anchor="middle">domaine de l'entreprise</text>

  <rect class="ms" x="600" y="52" width="160" height="54" rx="6"/>
  <text class="lb ink" x="680" y="76" text-anchor="middle">Microsoft Entra ID</text>
  <text class="sm mut" x="680" y="94" text-anchor="middle">authentification</text>

  <rect class="ms" x="790" y="52" width="140" height="54" rx="6"/>
  <text class="lb ink" x="860" y="76" text-anchor="middle">Microsoft Intune</text>
  <text class="sm mut" x="860" y="94" text-anchor="middle">enrôlement MDM</text>

  <line class="lif" x1="110" y1="106" x2="110" y2="424"/>
  <line class="lif" x1="430" y1="106" x2="430" y2="424"/>
  <line class="lif" x1="680" y1="106" x2="680" y2="424"/>
  <line class="lif" x1="860" y1="106" x2="860" y2="424"/>

  <!-- ① découverte -->
  <text class="sm ink" x="120" y="146">① GET</text>
  <text class="mono acc" x="166" y="146">/.well-known/com.apple.remotemanagement</text>
  <line class="lnA" x1="110" y1="158" x2="420" y2="158" marker-end="url(#flA)"/>

  <!-- activation serveur + contrôle TLS -->
  <rect class="box" x="424" y="152" width="12" height="92"/>
  <line class="lnA" x1="436" y1="196" x2="446" y2="196"/>
  <rect class="chk" x="446" y="132" width="216" height="148" rx="6"/>
  <text class="lb acc" x="460" y="154">Contrôle TLS iOS 27</text>
  <text class="sm ink" x="460" y="176">TLS ≥ 1.2 (1.3 recommandé)</text>
  <text class="sm ink" x="460" y="195">Suites ECDHE + AES-GCM</text>
  <text class="sm ink" x="460" y="214">Extended Master Secret</text>
  <text class="sm ink" x="460" y="233">Certificat SHA-256, RSA ≥ 2048</text>
  <line class="sep" x1="460" y1="246" x2="648" y2="246"/>
  <text class="xs mut" x="460" y="264">vérifié par</text>
  <text class="mono acc" x="520" y="264">audit_intune_ios.sh</text>

  <!-- ② réponse -->
  <text class="sm ink" x="120" y="226">② JSON : version mdm-byod, BaseURL Intune</text>
  <line class="ln" x1="424" y1="238" x2="114" y2="238" marker-end="url(#fl)" stroke-dasharray="6 4"/>

  <!-- ③ authentification -->
  <text class="sm ink" x="120" y="318">③ Authentification du compte professionnel</text>
  <line class="ln" x1="110" y1="330" x2="676" y2="330" marker-end="url(#fl)"/>

  <!-- ④ enrôlement -->
  <text class="sm ink" x="120" y="382">④ Enrôlement, profils et apps</text>
  <line class="ln" x1="110" y1="394" x2="856" y2="394" marker-end="url(#fl)"/>
  <text class="xs mut" x="930" y="440" text-anchor="end">③ ④ : TLS géré par Microsoft</text>

  <!-- échec -->
  <rect class="err" x="30" y="442" width="600" height="50" rx="6"/>
  <text class="lb dan" x="46" y="463">Si le contrôle ① échoue</text>
  <text class="sm ink" x="46" y="481">l'iPhone affiche « Your Apple Account does not support the expected services »</text>

  <line class="sep" x1="30" y1="520" x2="930" y2="520"/>

  <!-- ===================== 2. Remédiation ===================== -->
  <text class="h2 mut" x="30" y="552">2 · REMÉDIATION DU SERVEUR WEB</text>

  <rect class="act" x="30" y="615" width="150" height="54" rx="6"/>
  <text class="lb ink" x="105" y="639" text-anchor="middle">Audit</text>
  <text class="mono mut" x="105" y="657" text-anchor="middle">audit_intune_ios.sh</text>

  <rect class="box" x="220" y="568" width="186" height="54" rx="6"/>
  <text class="lb ink" x="313" y="592" text-anchor="middle">Protocoles ou suites</text>
  <text class="sm mut" x="313" y="610" text-anchor="middle">hors liste Apple</text>

  <rect class="box" x="220" y="668" width="186" height="54" rx="6"/>
  <text class="lb dan" x="313" y="692" text-anchor="middle">EMS absent</text>
  <text class="sm mut" x="313" y="710" text-anchor="middle">OpenSSL serveur &lt; 1.1.0</text>

  <rect class="box" x="446" y="568" width="250" height="54" rx="6"/>
  <text class="lb ink" x="571" y="592" text-anchor="middle">Restreindre la configuration</text>
  <text class="sm mut" x="571" y="610" text-anchor="middle">Apache · nginx · HAProxy</text>

  <rect class="box" x="446" y="652" width="250" height="118" rx="6"/>
  <text class="lb ink" x="462" y="675">Changer la pile TLS</text>
  <text class="sm ink" x="462" y="699">a. Migrer vers un OS récent</text>
  <text class="sm ink" x="462" y="721">b. Proxy TLS récent en frontal</text>
  <text class="sm ink" x="462" y="743">c. Recompiler le serveur web</text>
  <text class="sm mut" x="478" y="759">avec OpenSSL 1.1.1 ou plus</text>

  <rect class="act" x="736" y="615" width="194" height="54" rx="6"/>
  <text class="lb ink" x="833" y="639" text-anchor="middle">Valider</text>
  <text class="sm mut" x="833" y="657" text-anchor="middle">ré-audit · nscurl · iOS 27</text>

  <path class="ln" d="M180,642 H200 V595 H216" marker-end="url(#fl)"/>
  <path class="ln" d="M200,642 V695 H216" marker-end="url(#fl)"/>
  <line class="ln" x1="406" y1="595" x2="442" y2="595" marker-end="url(#fl)"/>
  <line class="ln" x1="406" y1="695" x2="442" y2="695" marker-end="url(#fl)"/>
  <path class="ln" d="M696,595 H716 V642 H732" marker-end="url(#fl)"/>
  <path class="ln" d="M696,711 H716 V642"/>
</svg>
